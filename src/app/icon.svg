<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CNSS-edu">
  <defs>
    <linearGradient id="cnssG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="cnssBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101917"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="cnssGlow" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="cnssSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#cnssBg)"/>
  <rect width="512" height="512" rx="118" fill="url(#cnssGlow)"/>

  <!-- faint grid mesh -->
  <g stroke="#10b981" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 128 H512 M0 384 H512 M128 0 V512 M384 0 V512"/>
  </g>

  <!-- orbit ring -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#34d399" stroke-opacity="0.20"
          stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round"/>

  <!-- network hex-mesh: ring edges -->
  <path d="M256 106 L385.9 181 L385.9 331 L256 406 L126.1 331 L126.1 181 Z"
        fill="none" stroke="url(#cnssG)" stroke-width="14" stroke-linejoin="round"/>

  <!-- spokes from center -->
  <g stroke="#10b981" stroke-opacity="0.78" stroke-width="9" stroke-linecap="round">
    <path d="M256 256 L256 106"/>
    <path d="M256 256 L385.9 181"/>
    <path d="M256 256 L385.9 331"/>
    <path d="M256 256 L256 406"/>
    <path d="M256 256 L126.1 331"/>
    <path d="M256 256 L126.1 181"/>
  </g>

  <!-- data packets in flight -->
  <g fill="#2dd4bf" filter="url(#cnssSoft)">
    <circle cx="256" cy="181" r="9"/>
    <circle cx="321" cy="293.5" r="8"/>
    <circle cx="191" cy="218.5" r="7"/>
  </g>

  <!-- perimeter nodes -->
  <g fill="#0a0f0d" stroke="url(#cnssG)" stroke-width="12">
    <circle cx="256" cy="106" r="29"/>
    <circle cx="385.9" cy="181" r="29"/>
    <circle cx="385.9" cy="331" r="29"/>
    <circle cx="256" cy="406" r="29"/>
    <circle cx="126.1" cy="331" r="29"/>
    <circle cx="126.1" cy="181" r="29"/>
  </g>
  <!-- node cores -->
  <g fill="#34d399">
    <circle cx="256" cy="106" r="8"/>
    <circle cx="385.9" cy="181" r="8"/>
    <circle cx="385.9" cy="331" r="8"/>
    <circle cx="256" cy="406" r="8"/>
    <circle cx="126.1" cy="331" r="8"/>
    <circle cx="126.1" cy="181" r="8"/>
  </g>

  <!-- center hub with terminal caret -->
  <circle cx="256" cy="256" r="58" fill="#0a0f0d" stroke="url(#cnssG)" stroke-width="12"/>
  <circle cx="256" cy="256" r="43" fill="url(#cnssG)"/>
  <g stroke="#032b20" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M238 240 L256 256 L238 272"/>
    <path d="M262 270 H281"/>
  </g>
</svg>
