<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CNSS-edu">
  <defs>
    <linearGradient id="cnssG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="cnssBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101917"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="cnssGlow" cx="0.5" cy="0.46" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="cnssSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- soft rounded-square canvas -->
  <rect width="512" height="512" rx="120" fill="url(#cnssBg)"/>
  <rect width="512" height="512" rx="120" fill="url(#cnssGlow)"/>

  <!-- faint background mesh -->
  <g stroke="#10b981" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 128 H512 M0 384 H512 M128 0 V512 M384 0 V512"/>
  </g>

  <!-- gentle dashed orbit rings (circles, not polygons) -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#10b981" stroke-opacity="0.30"
          stroke-width="3" stroke-dasharray="3 15" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#10b981" stroke-opacity="0.14"
          stroke-width="2.5" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- ── soft curved network arcs (bezier, round caps) ─────────────── -->
  <g fill="none" stroke="#10b981" stroke-opacity="0.8" stroke-width="9" stroke-linecap="round">
    <path d="M256 256 Q282 182 256 112"/>
    <path d="M256 256 Q342 196 372 168"/>
    <path d="M256 256 Q350 302 392 314"/>
    <path d="M256 256 Q294 348 298 404"/>
    <path d="M256 256 Q186 322 152 352"/>
    <path d="M256 256 Q174 208 142 176"/>
  </g>
  <!-- quieter inter-node mesh arcs -->
  <g fill="none" stroke="#10b981" stroke-opacity="0.32" stroke-width="6" stroke-linecap="round">
    <path d="M372 168 Q414 240 392 314"/>
    <path d="M152 352 Q110 262 142 176"/>
  </g>

  <!-- data packets in flight (soft glow) -->
  <g fill="#2dd4bf" filter="url(#cnssSoft)">
    <circle cx="312" cy="202" r="9"/>
    <circle cx="198" cy="302" r="8"/>
    <circle cx="262" cy="182" r="7"/>
    <circle cx="284" cy="344" r="6.5"/>
  </g>

  <!-- ── perimeter nodes (round, soft) ─────────────────────────────── -->
  <g fill="#0a0f0d" stroke="url(#cnssG)" stroke-width="11">
    <circle cx="256" cy="112" r="27"/>
    <circle cx="372" cy="168" r="27"/>
    <circle cx="392" cy="314" r="27"/>
    <circle cx="298" cy="404" r="27"/>
    <circle cx="152" cy="352" r="27"/>
    <circle cx="142" cy="176" r="27"/>
  </g>
  <!-- node cores -->
  <g fill="#34d399">
    <circle cx="256" cy="112" r="7.5"/>
    <circle cx="372" cy="168" r="7.5"/>
    <circle cx="392" cy="314" r="7.5"/>
    <circle cx="298" cy="404" r="7.5"/>
    <circle cx="152" cy="352" r="7.5"/>
    <circle cx="142" cy="176" r="7.5"/>
  </g>

  <!-- ── central hub: soft circle + rounded terminal caret ─────────── -->
  <circle cx="256" cy="256" r="60" fill="#0a0f0d" stroke="url(#cnssG)" stroke-width="12"/>
  <circle cx="256" cy="256" r="44" fill="url(#cnssG)"/>
  <!-- curved caret wing + soft dot — terminal identity, zero straight lines -->
  <path d="M234 239 Q261 257 234 275" stroke="#032b20" stroke-width="11" stroke-linecap="round" fill="none"/>
  <circle cx="268" cy="271" r="6.5" fill="#032b20"/>
</svg>
